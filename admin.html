<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouvelle réunion</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f1e1d;--tx2:#5f5e5a;--bd:#e0ded6;--ac:#185fa5;--acbg:#e6f1fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:22px;font-weight:600;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input[type=number]{width:90px}
.pt{display:flex;align-items:center;gap:10px;margin:8px 0}
.num{width:28px;height:28px;border-radius:50%;background:var(--acbg);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
button{font:inherit;cursor:pointer}
#go{width:100%;padding:13px;font-size:16px;font-weight:600;border:none;border-radius:12px;background:var(--ac);color:#fff}
#go:disabled{opacity:.5}
.msg{border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}
.err{color:#791f1f;background:#fcebeb}
.ok{color:#27500a;background:#eaf3de}
</style>
</head>
<body>
<div class="wrap">
  <h1>Créer une réunion</h1>
  <div class="card">
    <label for="titre">Titre de la réunion (unique)</label>
    <input type="text" id="titre" placeholder="Réunion d'équipe du 16 novembre">
    <label for="nb">Nombre de points à l'ordre du jour</label>
    <input type="number" id="nb" min="1" max="20" value="4">
    <div id="pts"></div>
    <label class="chk"><input type="checkbox" id="act" checked> Activer cette réunion (désactive les autres)</label>
  </div>
  <div id="msg" class="msg" hidden></div>
  <button id="go">Créer la réunion</button>
</div>

<script>
grist.ready({requiredAccess:'full'});
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var VAL=[];

function keep(){
  var els=document.querySelectorAll('#pts input');
  VAL=[].map.call(els,function(e){return e.value});
}
function draw(){
  var n=Math.max(1,Math.min(20,+$('nb').value||1)),h='';
  for(var i=0;i<n;i++){
    h+='<div class="pt"><span class="num">'+(i+1)+'</span><input type="text" placeholder="Intitulé du point '+(i+1)+'" value="'+esc(VAL[i]||'')+'"></div>';
  }
  $('pts').innerHTML=h;
}
function show(t,c){var m=$('msg');m.textContent=t;m.className='msg '+c;m.hidden=false}

$('nb').oninput=function(){keep();draw()};

$('go').onclick=function(){
  keep();
  var titre=$('titre').value.trim();
  var pts=VAL.map(function(v){return v.trim()}).filter(Boolean);
  $('msg').hidden=true;
  if(!titre){show('Saisissez un titre de réunion.','err');return}
  if(!pts.length){show('Saisissez au moins un point.','err');return}
  $('go').disabled=true;
  var activate=$('act').checked;

  grist.docApi.fetchTable('Reunions').then(function(R){
    if(R.Titre.indexOf(titre)>=0)throw new Error('Une réunion porte déjà ce titre.');
    var actions=[];
    if(activate&&R.id.length){
      actions.push(['BulkUpdateRecord','Reunions',R.id,{Active:R.id.map(function(){return false})}]);
    }
    actions.push(['AddRecord','Reunions',null,{Titre:titre,Active:activate}]);
    return grist.docApi.applyUserActions(actions);
  }).then(function(res){
    var rid=res.retValues[res.retValues.length-1];
    var n=pts.length;
    return grist.docApi.applyUserActions([['BulkAddRecord','Points',
      pts.map(function(){return null}),
      {Reunion:pts.map(function(){return rid}),
       Ordre:pts.map(function(p,i){return i+1}),
       Intitule:pts}]]);
  }).then(function(){
    show('Réunion créée avec '+pts.length+' point(s).','ok');
    $('titre').value='';VAL=[];draw();$('go').disabled=false;
  }).catch(function(e){
    show('Échec : '+(e&&e.message?e.message:e),'err');$('go').disabled=false;
  });
};
draw();
</script>
</body>
</html>
