<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Évaluation de réunion – résultats</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--tx2:#5f5e5a;--bd:#e0ded6;--ac:#185fa5;--acbg:#e6f1fb;--ok:#eaf3de;--okt:#27500a;--ko:#fcebeb;--kot:#791f1f;--wa:#faeeda;--wat:#633806;--gr:#f1efe8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
h3{font-size:16px;font-weight:500;margin:0 0 6px}
.note{font-size:13px;color:var(--tx2);margin:8px 0}
button{font:inherit;font-size:14px;padding:5px 11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--tx2)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:10px 0}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}
.m{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.m small{display:block;color:var(--tx2);font-size:12px}
.m b{font-size:22px;font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--tx2);font-weight:500}
.z{font-size:12px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.z-ok{background:var(--ok);color:var(--okt)}
.z-ko{background:var(--ko);color:var(--kot)}
.z-wa{background:var(--wa);color:var(--wat)}
.z-gr{background:var(--gr);color:var(--tx2)}
svg{width:100%;max-width:460px;display:block}
svg .tl{fill:var(--tx2);font-size:11px}
svg .ax{fill:var(--tx2);font-size:12px}
.legend{font-size:13px;color:var(--tx2);margin:6px 0 0}
.sub{margin:14px 0 4px;font-size:15px;font-weight:500}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.bar span{width:120px;flex:none;color:var(--tx2)}
.bar div{flex:1;min-width:0}
.bar i{display:block;height:10px;background:var(--ac);border-radius:5px;opacity:.7}
.bar em{font-style:normal;width:72px;flex:none;text-align:right}
#detail{overflow-x:auto}
</style>
</head>
<body>
<div id="msg" class="note">En attente des données de Grist…</div>
<div id="app" hidden>
  <div class="mets">
    <div class="m"><small>Réponses</small><b id="mN">0</b></div>
    <div class="m"><small>Intérêt moyen</small><b id="mV">–</b></div>
    <div class="m"><small>Qualité moyenne</small><b id="mQ">–</b></div>
    <div class="m"><small>Score global</small><b id="mS">–</b></div>
    <div class="m"><small>Se sentent concernés</small><b id="mC">–</b></div>
  </div>
  <select id="selR" style="font:inherit;padding:5px 8px;margin-top:8px"></select>
  <div id="tabs" class="tabs"></div>
  <div class="card">
    <div id="grid"></div>
    <p id="legend" class="legend"></p>
  </div>
  <div id="detail" class="card"></div>
</div>

<script>
var LABEL_X="Intérêt du point à l'ordre du jour";
var LABEL_Y="Qualité de la présentation";
var X0=40,Y0=290,U=26;
var ROWS=[],POINTS=[],tabSel=-1;

grist.ready({
  requiredAccess:'read table',
  columns:[
    {name:'point',title:'Point',type:'Any'},
    {name:'interet',title:'Intérêt',type:'Numeric,Int'},
    {name:'qualite',title:'Qualité',type:'Numeric,Int'},
    {name:'concerne',title:'Concerné(e)',type:'Any',optional:true},
    {name:'utilite',title:'Utilité',type:'Any',optional:true},
    {name:'commentaire',title:'Commentaire',type:'Any',optional:true},
    {name:'reunion',title:'Réunion',type:'Any',optional:true}
  ]
});

/* ---------- Utilitaires ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function pct(a,b){return b?Math.round(100*a/b):0}
function isNum(x){return x!==null&&x!==''&&!isNaN(+x)}
function px(v){return X0+v*U}
function py(q){return Y0-q*U}
function zone(v,q){
  var h=v>=5.5,g=q>=5.5;
  if(h&&g)return["Idéal","ok"];
  if(h)return["À corriger","ko"];
  if(g)return["À questionner","wa"];
  return["À supprimer","gr"];
}
function chip(v,q){var z=zone(v,q);return '<span class="z z-'+z[1]+'">'+z[0]+'</span>'}

/* Concerné(e) : on normalise les valeurs en 3 catégories */
var CONC=[["oui","Oui"],["partiel","En partie"],["non","Non"]];
function normConc(x){
  var s=String(x==null?'':x).trim().toLowerCase();
  if(s==='oui')return'oui';
  if(s==='non')return'non';
  if(s.indexOf('partie')>=0||s.indexOf('partiel')>=0)return'partiel';
  return'';
}
function concLabel(k){for(var i=0;i<CONC.length;i++)if(CONC[i][0]===k)return CONC[i][1];return'–'}

/* Utilité : liste de choix Grist (['L','a','b']), tableau ou texte séparé par des virgules */
function normUses(x){
  if(Array.isArray(x))return(x[0]==='L'?x.slice(1):x).map(String);
  if(typeof x==='string'&&x.trim())return x.split(/[,;]/).map(function(s){return s.trim()}).filter(Boolean);
  return[];
}

/* ---------- Réception des données ---------- */
var ALL=[];
function applyFilter(){
  var sel=$('selR').value;
  ROWS=ALL.filter(function(r){return !sel||r.m===sel});
  POINTS=[];
  ROWS.forEach(function(r){if(POINTS.indexOf(r.p)<0)POINTS.push(r.p)});
  tabSel=-1;
  render();
}
$('selR').onchange=applyFilter;

grist.onRecords(function(records){
  var mapped=grist.mapColumnNames(records);
  if(!mapped){
    $('msg').hidden=false;
    $('msg').textContent="Associez les colonnes Point, Intérêt et Qualité dans le panneau de droite du widget.";
    $('app').hidden=true;
    return;
  }
  ALL=mapped.filter(function(r){
    return r.point!=null&&String(r.point).trim()!==''&&isNum(r.interet)&&isNum(r.qualite);
  }).map(function(r){
    return{p:String(r.point).trim(),v:+r.interet,q:+r.qualite,
           n:normConc(r.concerne),u:normUses(r.utilite),
           c:r.commentaire?String(r.commentaire):'',
           m:r.reunion?String(r.reunion):''};
  });
  var meets=[];
  ALL.forEach(function(r){if(r.m&&meets.indexOf(r.m)<0)meets.push(r.m)});
  var sel=$('selR'),cur=sel.value;
  sel.innerHTML='<option value="">Toutes les réunions</option>'+
    meets.map(function(m){return'<option value="'+esc(m)+'">'+esc(m)+'</option>'}).join('');
  sel.value=meets.indexOf(cur)>=0?cur:(meets.length?meets[meets.length-1]:'');
  $('msg').hidden=true;$('app').hidden=false;
  applyFilter();
});

/* ---------- Statistiques ---------- */
function stats(pd){
  var nc={oui:0,partiel:0,non:0},nn=0,uc={};
  pd.forEach(function(x){
    if(x.n){nc[x.n]++;nn++}
    x.u.forEach(function(l){uc[l]=(uc[l]||0)+1});
  });
  return{nc:nc,nn:nn,uc:uc};
}
function concTxt(s){
  if(!s.nn)return'–';
  return'Oui '+pct(s.nc.oui,s.nn)+' % · En partie '+pct(s.nc.partiel,s.nn)+' % · Non '+pct(s.nc.non,s.nn)+' %';
}
function topUses(uc,n){
  var k=Object.keys(uc).sort(function(a,b){return uc[b]-uc[a]}).slice(0,n);
  return k.length?k.map(function(l){return esc(l)+' ('+uc[l]+')'}).join(', '):'–';
}
function bar(label,n,tot){
  var w=pct(n,tot);
  return'<div class="bar"><span>'+esc(label)+'</span><div><i style="width:'+w+'%"></i></div><em>'+n+' ('+w+' %)</em></div>';
}
function pointData(p){return ROWS.filter(function(r){return r.p===p})}

/* ---------- Grille 2×2 ---------- */
function baseGrid(){
  var m=px(5.5),n=py(5.5),T=py(10),R=px(10),s='';
  s+='<rect x="'+X0+'" y="'+T+'" width="'+(m-X0)+'" height="'+(n-T)+'" style="fill:var(--wa)" opacity=".6"/>';
  s+='<rect x="'+m+'" y="'+T+'" width="'+(R-m)+'" height="'+(n-T)+'" style="fill:var(--ok)" opacity=".6"/>';
  s+='<rect x="'+X0+'" y="'+n+'" width="'+(m-X0)+'" height="'+(Y0-n)+'" style="fill:var(--gr)" opacity=".7"/>';
  s+='<rect x="'+m+'" y="'+n+'" width="'+(R-m)+'" height="'+(Y0-n)+'" style="fill:var(--ko)" opacity=".6"/>';
  for(var i=0;i<=10;i++){
    s+='<line x1="'+px(i)+'" y1="'+Y0+'" x2="'+px(i)+'" y2="'+T+'" style="stroke:var(--bd)" stroke-width="0.5"/>';
    s+='<line x1="'+X0+'" y1="'+py(i)+'" x2="'+R+'" y2="'+py(i)+'" style="stroke:var(--bd)" stroke-width="0.5"/>';
    if(i>0){
      s+='<text class="tl" x="'+px(i)+'" y="'+(Y0+14)+'" text-anchor="middle">'+i+'</text>';
      s+='<text class="tl" x="'+(X0-8)+'" y="'+(py(i)+4)+'" text-anchor="end">'+i+'</text>';
    }
  }
  s+='<line x1="'+m+'" y1="'+Y0+'" x2="'+m+'" y2="'+T+'" style="stroke:var(--tx2)" stroke-width="1" stroke-dasharray="4 3"/>';
  s+='<line x1="'+X0+'" y1="'+n+'" x2="'+R+'" y2="'+n+'" style="stroke:var(--tx2)" stroke-width="1" stroke-dasharray="4 3"/>';
  s+='<text class="tl" x="'+(X0+6)+'" y="'+(T+15)+'" style="fill:var(--wat)">À questionner</text>';
  s+='<text class="tl" x="'+(R-6)+'" y="'+(T+15)+'" text-anchor="end" style="fill:var(--okt)">Idéal</text>';
  s+='<text class="tl" x="'+(X0+6)+'" y="'+(Y0-6)+'">À supprimer</text>';
  s+='<text class="tl" x="'+(R-6)+'" y="'+(Y0-6)+'" text-anchor="end" style="fill:var(--kot)">À corriger</text>';
  s+='<text class="ax" x="'+(X0+5*U)+'" y="314" text-anchor="middle">'+esc(LABEL_X)+'</text>';
  s+='<text class="ax" transform="rotate(-90)" x="'+(-(Y0-5*U))+'" y="12" text-anchor="middle">'+esc(LABEL_Y)+'</text>';
  return s;
}
function numberedDot(i,v,q,title){
  return'<g><title>'+esc(title)+'</title><circle cx="'+px(v)+'" cy="'+py(q)+'" r="11" style="fill:var(--card);stroke:var(--ac)" stroke-width="1.5"/><text x="'+px(v)+'" y="'+(py(q)+4)+'" text-anchor="middle" font-size="12" style="fill:var(--ac)">'+(i+1)+'</text></g>';
}

/* ---------- Affichage ---------- */
function render(){
  var N=ROWS.length;
  if(tabSel>=POINTS.length)tabSel=-1;

  var gs=stats(ROWS);
  $('mN').textContent=N;
  $('mV').textContent=N?mean(ROWS.map(function(x){return x.v})).toFixed(1):'–';
  $('mQ').textContent=N?mean(ROWS.map(function(x){return x.q})).toFixed(1):'–';
  $('mS').textContent=N?Math.round(mean(ROWS.map(function(x){return x.v*x.q})))+' %':'–';
  $('mC').textContent=gs.nn?pct(gs.nc.oui,gs.nn)+' %':'–';

  var t='<button data-t="-1" class="'+(tabSel<0?'on':'')+'">Vue d\'ensemble</button>';
  POINTS.forEach(function(p,i){
    t+='<button data-t="'+i+'" title="'+esc(p)+'" class="'+(tabSel===i?'on':'')+'">Point '+(i+1)+'</button>';
  });
  $('tabs').innerHTML=t;

  var g='',d='';
  if(tabSel<0){
    ROWS.forEach(function(x){
      g+='<circle cx="'+px(x.v)+'" cy="'+py(x.q)+'" r="3" style="fill:var(--tx2)" opacity=".4"/>';
    });
    d='<table><tr><th>Point</th><th>Intérêt moy.</th><th>Qualité moy.</th><th>Zone</th><th>Concerné(e)</th><th>Utilité (les plus citées)</th><th>Réponses</th></tr>';
    POINTS.forEach(function(p,i){
      var pd=pointData(p),st=stats(pd);
      var mv=mean(pd.map(function(x){return x.v})),mq=mean(pd.map(function(x){return x.q}));
      g+=numberedDot(i,mv,mq,p);
      d+='<tr><td>'+(i+1)+'. '+esc(p)+'</td><td>'+mv.toFixed(1)+'</td><td>'+mq.toFixed(1)+'</td><td>'+chip(mv,mq)+'</td><td>'+concTxt(st)+'</td><td>'+topUses(st.uc,3)+'</td><td>'+pd.length+'</td></tr>';
    });
    d+='</table>';
    var com=ROWS.filter(function(x){return x.c});
    if(com.length){
      d+='<h3 style="margin-top:14px">Commentaires</h3><ul>';
      com.forEach(function(x){d+='<li><b>'+esc(x.p)+' :</b> '+esc(x.c)+'</li>'});
      d+='</ul>';
    }
    if(!N)d='<p class="note">Aucune réponse pour l\'instant.</p>';
    $('legend').textContent='Les numéros indiquent la moyenne de chaque point. Les petits points gris sont les réponses individuelles.';
  }else{
    var p=POINTS[tabSel],pd=pointData(p),cnt={};
    pd.forEach(function(x){var k=x.v+','+x.q;cnt[k]=(cnt[k]||0)+1});
    Object.keys(cnt).forEach(function(k){
      var a=k.split(','),v=+a[0],q=+a[1],n=cnt[k],r=Math.min(8+5*(n-1),24);
      g+='<g><title>'+n+' réponse'+(n>1?'s':'')+' : intérêt '+v+', qualité '+q+'</title><circle cx="'+px(v)+'" cy="'+py(q)+'" r="'+r+'" style="fill:var(--ac);stroke:var(--ac)" fill-opacity=".35" stroke-width="1.5"/>';
      if(n>1)g+='<text x="'+px(v)+'" y="'+(py(q)+5)+'" text-anchor="middle" font-size="14" style="fill:var(--tx)">'+n+'</text>';
      g+='</g>';
    });
    var st=stats(pd);
    d='<h3>'+(tabSel+1)+'. '+esc(p)+'</h3>';
    d+='<p class="sub">Vous sentez-vous concerné(e) par ce point ?</p>';
    CONC.forEach(function(c){d+=bar(c[1],st.nc[c[0]],st.nn)});
    d+='<p class="sub">Utilité du point selon les participants</p>';
    var labels=Object.keys(st.uc).sort(function(a,b){return st.uc[b]-st.uc[a]});
    if(labels.length)labels.forEach(function(l){d+=bar(l,st.uc[l],pd.length)});
    else d+='<p class="note">Aucune utilité renseignée.</p>';
    d+='<p class="sub">Réponses individuelles</p>';
    d+='<table><tr><th>Réponse</th><th>Concerné(e)</th><th>Intérêt</th><th>Qualité</th><th>Zone</th><th>Utilité</th><th>Commentaire</th></tr>';
    pd.forEach(function(x,k){
      d+='<tr><td>'+(k+1)+'</td><td>'+esc(concLabel(x.n))+'</td><td>'+x.v+'</td><td>'+x.q+'</td><td>'+chip(x.v,x.q)+'</td><td>'+(x.u.map(esc).join(', ')||'–')+'</td><td>'+esc(x.c)+'</td></tr>';
    });
    d+='</table>';
    $('legend').textContent='Chaque bulle correspond à une combinaison de notes. Plus elle est grosse, plus il y a de réponses identiques (le chiffre indique leur nombre).';
  }
  $('grid').innerHTML='<svg viewBox="0 0 320 320" role="img" aria-label="Grille intérêt par qualité">'+baseGrid()+g+'</svg>';
  $('detail').innerHTML=d;
}

$('tabs').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  tabSel=+b.getAttribute('data-t');
  render();
};
</script>
</body>
</html>
